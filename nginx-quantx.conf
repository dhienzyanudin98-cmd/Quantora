# Taruh di /etc/nginx/sites-available/quantx.conf lalu symlink ke sites-enabled
# Sesuaikan domain & path certbot dengan yang kamu pakai untuk dalgo.

server {
    listen 80;
    server_name quantx.namadomainmu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quantx.namadomainmu.com;

    ssl_certificate     /etc/letsencrypt/live/quantx.namadomainmu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantx.namadomainmu.com/privkey.pem;

    root /var/www/quantx;
    index index.html;

    # Service worker & manifest jangan di-cache lama supaya update selalu kepakai
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
